<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
<title>Jenni Conner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700&display=swap');

  :root {
    --bg: #f6f1e7;
    --stroke: #26201a;
    --c1: #e0217a; /* fuchsia */
    --c2: #f2b705; /* golden yellow */
    --c3: #2f86c9; /* cerulean */
    --depth: #6b1e4f;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1812;
      --stroke: #f1e9da;
      --c1: #f04d97;
      --c2: #ffce3a;
      --c3: #4ea3e0;
      --depth: #8a3468;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    overflow: hidden;
    cursor: default;
  }

  #dvd {
    position: fixed;
    top: 0;
    left: 0;
    margin: 0;
    padding: 0;
    white-space: nowrap;
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: clamp(2rem, 7vw, 4.5rem);
    letter-spacing: -0.01em;
    will-change: transform;
    filter: drop-shadow(2px 4px 5px rgba(0, 0, 0, 0.25));
  }

  /* Solid offset back copy — a single clean duplicate behind the text,
     the way classic WordArt built its 3D look. */
  #dvd::before {
    content: attr(data-text);
    position: absolute;
    top: 0.09em;
    left: 0.05em;
    z-index: 0;
    color: var(--depth);
    -webkit-text-stroke: 1.5px var(--depth);
  }

  #dvd .front {
    position: relative;
    z-index: 1;
    background-image: linear-gradient(115deg, var(--grad-a, var(--c1)) 0%, var(--grad-b, var(--c2)) 50%, var(--grad-c, var(--c3)) 100%);
    background-size: 140% 140%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--stroke);
    paint-order: stroke fill;
  }

  @media (prefers-reduced-motion: reduce) {
    #dvd {
      position: relative;
      display: block;
      text-align: center;
      margin-top: 42vh;
    }
  }
</style>
</head>
<body>
  <h1 id="dvd" data-text="coming soon!"><span class="front">coming soon!</span></h1>
  <script>
    const el = document.getElementById('dvd');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Palette permutations to cycle through on each wall hit, so the
    // gradient reshuffles like the DVD logo changing color.
    const palettes = [
      ['var(--c1)', 'var(--c2)', 'var(--c3)'],
      ['var(--c2)', 'var(--c3)', 'var(--c1)'],
      ['var(--c3)', 'var(--c1)', 'var(--c2)'],
      ['var(--c1)', 'var(--c3)', 'var(--c2)'],
      ['var(--c2)', 'var(--c1)', 'var(--c3)'],
      ['var(--c3)', 'var(--c2)', 'var(--c1)'],
    ];

    function cyclePalette() {
      const p = palettes[Math.floor(Math.random() * palettes.length)];
      el.style.setProperty('--grad-a', p[0]);
      el.style.setProperty('--grad-b', p[1]);
      el.style.setProperty('--grad-c', p[2]);
    }
    cyclePalette();

    if (!reduceMotion) {
      let x = Math.random() * (window.innerWidth * 0.5);
      let y = Math.random() * (window.innerHeight * 0.5);
      const speed = 2.4;
      let angle = Math.random() * Math.PI * 2;
      let vx = Math.cos(angle) * speed;
      let vy = Math.sin(angle) * speed;

      function bounds() {
        const rect = el.getBoundingClientRect();
        return {
          w: rect.width,
          h: rect.height,
          maxX: window.innerWidth - rect.width,
          maxY: window.innerHeight - rect.height,
        };
      }

      let b = bounds();
      window.addEventListener('resize', () => {
        b = bounds();
        x = Math.min(x, Math.max(0, b.maxX));
        y = Math.min(y, Math.max(0, b.maxY));
      });

      // Small random jitter added to the bounce angle, so it drifts unpredictably
      // like a real DVD logo instead of tracing the exact same path forever.
      function jitter(v) {
        return v + (Math.random() - 0.5) * 0.6;
      }

      function tick() {
        x += vx;
        y += vy;

        let hit = false;

        if (x <= 0) {
          x = 0;
          vx = Math.abs(jitter(vx));
          hit = true;
        } else if (x >= b.maxX) {
          x = b.maxX;
          vx = -Math.abs(jitter(vx));
          hit = true;
        }

        if (y <= 0) {
          y = 0;
          vy = Math.abs(jitter(vy));
          hit = true;
        } else if (y >= b.maxY) {
          y = b.maxY;
          vy = -Math.abs(jitter(vy));
          hit = true;
        }

        // Keep speed roughly constant even after jitter.
        const mag = Math.hypot(vx, vy) || speed;
        vx = (vx / mag) * speed;
        vy = (vy / mag) * speed;

        if (hit) cyclePalette();

        el.style.transform = `translate(${x}px, ${y}px)`;
        requestAnimationFrame(tick);
      }

      // Recompute bounds once layout/fonts settle, then start.
      requestAnimationFrame(() => {
        b = bounds();
        tick();
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JC-TC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f4ef;--surface:#fff;--border:#e5e0d8;--text:#18150f;--muted:#8a8178;--accent:#b86e2a;
  --go-solid:#2d7a58;--go-bg:#e4f2eb;--go-text:#1a5e40;
  --eat-solid:#cc4444;--eat-bg:#fce9e9;--eat-text:#9e2828;
  --watch-solid:#3d6db5;--watch-bg:#e6edf8;--watch-text:#284d8a;
  --read-solid:#7a4ea0;--read-bg:#efe8f8;--read-text:#5a3278;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:920px;margin:0 auto;padding:2.5rem 1.5rem 5rem}

/* HEADER */
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:3rem;padding-bottom:1.5rem;border-bottom:2px solid var(--text)}
.header-left h1{font-family:'Playfair Display',serif;font-size:3.5rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.header-left .tagline{font-size:.78rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-top:.5rem}
.refresh-btn{display:flex;align-items:center;gap:.4rem;padding:.4rem .9rem;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:.78rem;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .15s}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}

/* HERO */
.hero-strip{display:grid;grid-template-columns:2fr 1fr 1fr;border:1.5px solid var(--text);border-radius:18px;overflow:hidden;margin-bottom:3rem}
.hero-main{background:var(--text);color:#fff;padding:2.25rem 2.5rem;display:flex;flex-direction:column;justify-content:flex-end}
.big-num{font-family:'Playfair Display',serif;font-size:5.5rem;font-weight:700;line-height:1;margin-bottom:.15rem}
.big-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;opacity:.55}
.big-sub{font-size:.82rem;opacity:.45;margin-top:.35rem}
.hero-side{padding:1.6rem 1.4rem;display:flex;flex-direction:column;justify-content:center;border-left:1.5px solid var(--text)}
.side-num{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:700;line-height:1;margin-bottom:.2rem}
.side-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
.side-sub{font-size:.72rem;color:var(--muted);margin-top:.15rem}

/* SECTION HEADING */
.section-head{display:flex;align-items:baseline;gap:.75rem;margin-bottom:1.2rem;margin-top:2.75rem}
.section-head h2{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:400;font-style:italic;white-space:nowrap}
.section-rule{flex:1;height:1px;background:var(--border)}
.section-count{font-size:.75rem;color:var(--muted);white-space:nowrap}

/* CAT BARS */
.cat-bar-list{display:flex;flex-direction:column;gap:.9rem}
.cat-bar-row{display:grid;grid-template-columns:80px 1fr 58px;align-items:center;gap:1rem}
.cat-bar-label{font-size:.8rem;font-weight:500;text-align:right;color:var(--muted)}
.cat-bar-track{height:13px;background:var(--border);border-radius:3px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.cat-bar-nums{font-size:.76rem;color:var(--muted);text-align:right}

/* MOSAIC */
.cat-mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--text);border:1.5px solid var(--text);border-radius:14px;overflow:hidden;margin-top:1.25rem}
.mosaic-cell{padding:1.3rem 1rem;text-align:center}
.mosaic-emoji{font-size:1.5rem;margin-bottom:.3rem}
.mosaic-num{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:700;line-height:1;margin-bottom:.15rem}
.mosaic-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;font-weight:500;opacity:.65}

/* COMPLETED SECTION */
.done-cat-block{margin-bottom:2.25rem}
.done-cat-head{display:flex;align-items:center;gap:.65rem;margin-bottom:1rem}
.done-cat-pill{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .85rem;border-radius:20px;font-size:.78rem;font-weight:500}
.done-cat-count{font-size:.72rem;color:var(--muted)}

/* Card styles — rich tiles */
.done-cards-grid{display:grid;gap:.65rem}
.done-cards-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.done-cards-grid.cols-2{grid-template-columns:repeat(2,1fr)}

.done-card{border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;display:flex;flex-direction:column}
.done-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.09)}

/* Decorative top band */
.done-card-band{height:6px;width:100%}
.done-card-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:.9rem 1rem 1rem;flex:1;display:flex;flex-direction:column;gap:.3rem}
.done-card-name{font-size:.9rem;font-weight:600;line-height:1.35;color:var(--text)}
.done-card-sub{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.done-card-note{font-size:.75rem;color:var(--muted);margin-top:.2rem;font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* Number badge on card */
.done-card-num{position:absolute;top:.7rem;right:.7rem;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff;opacity:.9}

/* MAP */
.map-outer{border:1.5px solid var(--text);border-radius:16px;overflow:hidden;margin-bottom:.5rem}
.map-header{background:var(--text);color:#fff;padding:.65rem 1.1rem;display:flex;align-items:center;justify-content:space-between}
.map-header-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;opacity:.7}
.map-header-count{font-size:.78rem;font-weight:600}
#go-map{width:100%;height:360px}
.map-loading{height:360px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;background:var(--surface)}

/* STILL ON LIST */
.still-wrap{display:flex;flex-wrap:wrap;gap:.4rem}
.still-chip{display:flex;align-items:center;gap:.4rem;padding:.3rem .8rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:.78rem;color:var(--muted)}
.still-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* CALENDAR */
.cal-grid-wrap{overflow-x:auto;padding-bottom:.25rem}
.cal-grid{display:flex;flex-direction:column;gap:0;user-select:none}
.cal-month-labels{display:flex;height:16px;position:relative;margin-bottom:2px}
.cal-month-tick{position:absolute;font-size:.6rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;line-height:1}
.cal-dow-labels{display:flex;flex-direction:column;gap:0;margin-right:4px;padding-top:0}
.cal-dow-label{height:13px;font-size:.58rem;color:var(--muted);text-align:right;line-height:13px}
.cal-body{display:flex;gap:0}
.cal-week-col{display:flex;flex-direction:column;gap:0}
.cal-cell{width:22px;height:22px;cursor:default;flex-shrink:0;position:relative}
.cal-cell.no-items{background:var(--border)}
.cal-cell.has-items{cursor:pointer}
.cal-cell.blank{background:transparent}
.cal-cell.has-items:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#18150f;color:#fff;font-size:.62rem;padding:2px 7px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:10}
.cal-legend{display:flex;align-items:center;gap:.5rem;margin-top:.65rem;font-size:.7rem;color:var(--muted)}
.cal-legend-swatch{width:16px;height:16px;border-radius:3px}

/* LOADING / ERROR */
.loading{text-align:center;padding:5rem 1rem;color:var(--muted)}
.spinner{display:inline-block;width:30px;height:30px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem}
.error-box{background:#fce9e9;border:1px solid #f0c0c0;border-radius:12px;padding:1.5rem;text-align:center;color:#9e2828;font-size:.875rem}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal{background:var(--surface);border-radius:16px;overflow:hidden;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal-band{height:8px}
.modal-inner{padding:1.75rem}
.modal-cat{font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.35rem}
.modal-title{font-family:'Playfair Display',serif;font-size:1.6rem;margin-bottom:.85rem;line-height:1.3}
.modal-meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem}
.modal-badge{font-size:.72rem;padding:3px 9px;border-radius:10px;font-weight:500}
.modal-note{padding:.85rem;background:var(--bg);border-radius:8px;font-size:.855rem;line-height:1.65;margin-bottom:.75rem}
.modal-link{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;color:var(--watch-text);text-decoration:none;margin-right:.85rem}
.modal-footer{display:flex;align-items:center;justify-content:space-between;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border)}
.btn-close{padding:.45rem 1rem;border:1px solid var(--border);border-radius:8px;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.875rem}

@media(max-width:680px){
  .hero-strip{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
  .hero-main{grid-column:1/-1}
  .cat-mosaic{grid-template-columns:repeat(2,1fr)}
  .done-cards-grid.cols-3{grid-template-columns:repeat(2,1fr)}
  .big-num{font-size:4rem}
}
@media(max-width:440px){
  .hero-strip{grid-template-columns:1fr}
  .hero-side{border-left:none;border-top:1.5px solid var(--text)}
  .done-cards-grid.cols-3,.done-cards-grid.cols-2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading"><div class="spinner"></div><br>Loading JC-TC...</div>
</div>
<script>
const API_KEY  = 'c85e9a60b5d55ad466bee0e6a3af7475';
const TOKEN    = 'ATTAecbc7deab1b15e4ac0e84324901dcdfb035cc6a1c1a46d977d5bcf1c64aaccf89D629D6E';
const BOARD_ID = 'X4e1ZbzY';

const CAT_DEFS = {
  'To Go 🚀':   {key:'go',    label:'Go',    emoji:'🚀', solid:'#2d7a58', bg:'#e4f2eb', text:'#1a5e40'},
  'To Eat 🍽️': {key:'eat',   label:'Eat',   emoji:'🍽️', solid:'#cc4444', bg:'#fce9e9', text:'#9e2828'},
  'To Watch 👀':{key:'watch', label:'Watch', emoji:'👀', solid:'#3d6db5', bg:'#e6edf8', text:'#284d8a'},
  'To Read 📚': {key:'read',  label:'Read',  emoji:'📚', solid:'#7a4ea0', bg:'#efe8f8', text:'#5a3278'},
};
const CAT_KEYS = ['To Go 🚀','To Eat 🍽️','To Watch 👀','To Read 📚'];

let allCards=[], allLists=[], customFields=[], selected=null, loading=true, error=null;
let completedFieldId=null, locationFieldId=null, mapInstance=null;

function isDoneList(n){ return /done/i.test(n); }
function getListName(id){ const l=allLists.find(l=>l.id===id); return l?l.name:''; }
function getCat(idList){ const n=getListName(idList); return CAT_DEFS[n]||{key:'other',label:n,emoji:'✦',solid:'#888',bg:'#eee',text:'#444'}; }
function isDone(c){ return isDoneList(getListName(c.idList))||!!getCompletedDate(c); }

function getCompletedDate(card){
  if(!card.customFieldItems||!completedFieldId) return null;
  const item=card.customFieldItems.find(f=>f.idCustomField===completedFieldId);
  if(!item||!item.value) return null;
  const raw=item.value.date||item.value.text||null;
  if(!raw) return null;
  const d=new Date(raw); return isNaN(d)?null:d;
}


/* Get the Location custom field value for a card (returns string or null) */
function getLocationField(card){
  if(!card.customFieldItems||!locationFieldId) return null;
  const item=card.customFieldItems.find(f=>f.idCustomField===locationFieldId);
  if(!item||!item.value) return null;
  return item.value.text||null;
}

/* ── PLACE NAME EXTRACTION ──
   Strip noise from card titles to get a geocodable place name.
   e.g. "Ballater (round 2!)" → "Ballater"
        "sketch London"       → "sketch London"   (kept — useful for geocoding)
        "Armstrong's Vintage (Edinburgh)" → "Armstrong's Vintage Edinburgh"
        "Sandwood Bay 🏖️"    → "Sandwood Bay"
*/
function extractPlaceName(title) {
  let s = title;
  // Remove emoji characters
  s = s.replace(/[\u{1F300}-\u{1FFFF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '');
  // Replace parenthetical noise like (round 2!), (again), (first time!) — keep if it looks like a place
  s = s.replace(/\(([^)]+)\)/g, (match, inner) => {
    const placeWords = /^[A-Z][a-z]/.test(inner.trim()) && !/round|again|finally|first|second|third|\d/i.test(inner);
    return placeWords ? ' ' + inner.trim() : '';
  });
  // Remove trailing punctuation / exclamation marks
  s = s.replace(/[!?]+$/, '').trim();
  // Collapse whitespace
  s = s.replace(/\s+/g,' ').trim();
  return s;
}

/* Geocode using Nominatim with a delay to respect rate limits */
const geocodeCache = {};
async function geocode(rawTitle, explicitQuery) {
  const query = explicitQuery ? explicitQuery.trim() : extractPlaceName(rawTitle);
  if(geocodeCache[query] !== undefined) return geocodeCache[query];
  try {
    await new Promise(r => setTimeout(r, 350)); // Nominatim rate limit: 1 req/sec
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&addressdetails=0`;
    const r = await fetch(url, {headers:{'Accept-Language':'en','User-Agent':'jctc-lifelist/1.0'}});
    const d = await r.json();
    if(d && d[0]) {
      const result = {lat:parseFloat(d[0].lat), lng:parseFloat(d[0].lon), place:query, type:d[0].type};
      geocodeCache[query] = result;
      return result;
    }
  } catch(e) {}
  geocodeCache[query] = null;
  return null;
}

async function fetchBoard(){
  loading=true; error=null; render();
  try{
    const qs=`key=${API_KEY}&token=${TOKEN}`;
    const [lr,cfr,cr]=await Promise.all([
      fetch(`https://api.trello.com/1/boards/${BOARD_ID}/lists?${qs}&fields=id,name`),
      fetch(`https://api.trello.com/1/boards/${BOARD_ID}/customFields?${qs}`),
      fetch(`https://api.trello.com/1/boards/${BOARD_ID}/cards?${qs}&fields=id,name,desc,idList,labels,url,due,dueComplete,customFieldItems&customFieldItems=true&filter=all`)
    ]);
    if(!lr.ok||!cr.ok) throw new Error('Trello API error — check key/token');
    allLists=await lr.json();
    customFields=cfr.ok?await cfr.json():[];
    allCards=await cr.json();
    const cf=customFields.find(f=>/completed/i.test(f.name));
    completedFieldId=cf?cf.id:null;
    const lf=customFields.find(f=>/location/i.test(f.name));
    locationFieldId=lf?lf.id:null;

  }catch(e){ error=e.message; }
  loading=false;
  render();
  // Geocode + init map after initial render
  setTimeout(()=>initMap(), 150);
}

/* ── MAP ── */
async function initMap(){
  const el = document.getElementById('go-map');
  if(!el) return;
  if(mapInstance){ mapInstance.remove(); mapInstance=null; }

  const goCards = allCards.filter(c=>!c.closed && isDone(c) && getCat(c.idList).key==='go');
  if(!goCards.length) return;

  // Show loading state inside map area
  el.innerHTML = '';
  mapInstance = L.map(el, {zoomControl:true, scrollWheelZoom:false, attributionControl:true});

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'© <a href="https://openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
    maxZoom:19
  }).addTo(mapInstance);

  const pinned = [];

  // Custom marker SVG
  function makeIcon(color){
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
      <path d="M14 0C6.27 0 0 6.27 0 14c0 9.625 14 22 14 22S28 23.625 28 14C28 6.27 21.73 0 14 0z" fill="${color}" stroke="#fff" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="5.5" fill="#fff" opacity="0.9"/>
    </svg>`;
    return L.divIcon({html:`<div style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))">${svg}</div>`,iconSize:[28,36],iconAnchor:[14,36],popupAnchor:[0,-36],className:''});
  }

  for(const card of goCards){
    const locationVal = getLocationField(card);
    const geo = await geocode(card.name, locationVal);
    if(!geo) continue;
    const completedD = getCompletedDate(card);
    const dateStr = completedD ? completedD.toLocaleDateString('en-GB',{month:'short',year:'numeric'}) : '';
    const cleanName = extractPlaceName(card.name);

    const marker = L.marker([geo.lat, geo.lng], {icon: makeIcon('#2d7a58')}).addTo(mapInstance);
    const popupLocation = locationVal || (cleanName !== card.name ? cleanName : null);
    marker.bindPopup(`
      <div style="font-family:'DM Sans',sans-serif;min-width:140px">
        <div style="font-weight:600;font-size:.875rem;margin-bottom:.2rem">${card.name}</div>
        ${popupLocation ? `<div style="font-size:.72rem;color:#666;margin-bottom:.15rem">📍 ${popupLocation}</div>` : ''}
        ${dateStr ? `<div style="font-size:.72rem;color:#888">✅ ${dateStr}</div>` : ''}
      </div>`, {maxWidth:220});
    pinned.push([geo.lat, geo.lng]);
  }

  if(pinned.length === 0){
    el.innerHTML = '<div style="height:360px;display:flex;align-items:center;justify-content:center;color:#8a8178;font-size:.85rem">Couldn\'t geocode any places</div>';
    return;
  }
  if(pinned.length === 1) mapInstance.setView(pinned[0], 8);
  else mapInstance.fitBounds(L.latLngBounds(pinned), {padding:[40,40]});

  // Update the header count
  const countEl = document.getElementById('map-pin-count');
  if(countEl) countEl.textContent = `${pinned.length} pin${pinned.length!==1?'s':''}`;
}

/* ── RENDER ── */
function renderReport(){
  const doneCards   = allCards.filter(c=>!c.closed&&isDone(c));
  const activeCards = allCards.filter(c=>!c.closed&&!isDone(c));
  const total       = allCards.filter(c=>!c.closed).length;
  const totalDone   = doneCards.length;
  const pct         = total?Math.round(totalDone/total*100):0;

  const catStats = CAT_KEYS.map(ln=>{
    const list = allLists.find(l=>l.name===ln);
    const total = list ? allCards.filter(c=>c.idList===list.id&&!c.closed).length : 0;
    const done  = list ? allCards.filter(c=>c.idList===list.id&&!c.closed&&isDone(c)).length : 0;
    const left  = total - done;
    return {ln, cat:CAT_DEFS[ln], total, done, left};
  });
  const maxCount = Math.max(...catStats.map(c=>c.total),1);

  const doneByCat = CAT_KEYS.map(ln=>{
    const list = allLists.find(l=>l.name===ln);
    const cards = list ? doneCards.filter(c=>c.idList===list.id) : [];
    return {ln, cat:CAT_DEFS[ln], cards};
  }).filter(g=>g.cards.length>0);

  const goDone = doneCards.filter(c=>getCat(c.idList).key==='go');

  // Calendar
  const calMap={};
  doneCards.forEach(c=>{
    const d=getCompletedDate(c); if(!d) return;
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(!calMap[k]) calMap[k]=[];
    calMap[k].push({name:c.name, cat:getCat(c.idList)});
  });

  const dateStr = c => {
    const d=getCompletedDate(c);
    return d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
  };

  return `
  <div class="page-header">
    <div class="header-left">
      <h1>JC-TC ✦</h1>
      <div class="tagline">life list &nbsp;·&nbsp; ${new Date().getFullYear()} &nbsp;·&nbsp; ${pct}% done</div>
    </div>
    <button class="refresh-btn" onclick="fetchBoard()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.9"/></svg>
      Refresh
    </button>
  </div>

  <!-- HERO -->
  <div class="hero-strip">
    <div class="hero-main">
      <div class="big-num">${totalDone}</div>
      <div class="big-label">✅ things done</div>
      <div class="big-sub">${pct}% of the full list</div>
    </div>
    <div class="hero-side">
      <div class="side-num" style="color:var(--accent)">${activeCards.length}</div>
      <div class="side-label">⏳ still to go</div>
      <div class="side-sub">${CAT_KEYS.length} categories</div>
    </div>
    <div class="hero-side">
      <div class="side-num">${total}</div>
      <div class="side-label">🗂️ total items</div>
      <div class="side-sub">on the list</div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="section-head"><h2>📊 Progress by category</h2><div class="section-rule"></div></div>
  <div class="cat-bar-list">
    ${catStats.map(c=>`
    <div class="cat-bar-row">
      <div class="cat-bar-label">${c.cat.emoji} ${c.cat.label}</div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.round(c.done/c.total*100)}%;background:${c.cat.solid}"></div></div>
      <div class="cat-bar-nums" style="color:${c.cat.text}">${c.done}/${c.total}</div>
    </div>`).join('')}
  </div>
  <div class="cat-mosaic">
    ${catStats.map(c=>`
    <div class="mosaic-cell" style="background:${c.cat.bg}">
      <div class="mosaic-emoji">${c.cat.emoji}</div>
      <div class="mosaic-num" style="color:${c.cat.text}">${c.left}</div>
      <div class="mosaic-label" style="color:${c.cat.text}">${c.cat.label}</div>
    </div>`).join('')}
  </div>

  <!-- COMPLETED BY CATEGORY -->
  ${doneByCat.length > 0 ? `
  <div class="section-head"><h2>🎉 Completed</h2><div class="section-rule"></div><div class="section-count">${totalDone} item${totalDone!==1?'s':''}</div></div>
  ${doneByCat.map(({cat, cards}, groupIdx) => {
    const cols = 'cols-3';
    return `<div class="done-cat-block">
      <div class="done-cat-head">
        <span class="done-cat-pill" style="background:${cat.bg};color:${cat.text}">${cat.emoji} ${cat.label}</span>
        <span class="done-cat-count">${cards.length} item${cards.length!==1?'s':''}</span>
      </div>
      <div class="done-cards-grid ${cols}">
        ${cards.map((c, i) => {
          const ds = dateStr(c);
          const desc = c.desc && !c.desc.startsWith('http') ? c.desc : '';
          return `<div class="done-card" onclick="openCard('${c.id}')">
            <div class="done-card-band" style="background:${cat.solid}"></div>
            <div class="done-card-body">
              <div class="done-card-num" style="background:${cat.solid}">${i+1}</div>
              <div class="done-card-name">${c.name}</div>
              <div class="done-card-sub">
                ${ds ? `<span>📅 ${ds}</span>` : ''}
                ${c.labels&&c.labels.length ? `<span style="background:${cat.bg};color:${cat.text};padding:1px 6px;border-radius:8px;font-size:.68rem;font-weight:500">${c.labels[0].name}</span>` : ''}
              </div>
              ${desc ? `<div class="done-card-note">${desc}</div>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('')}` : ''}

  <!-- MAP -->
  ${goDone.length > 0 ? `
  <div class="section-head"><h2>🗺️ Places visited</h2><div class="section-rule"></div></div>
  <div class="map-outer">
    <div class="map-header">
      <span class="map-header-title">🚀 Go — completed destinations</span>
      <span class="map-header-count" id="map-pin-count">pinning…</span>
    </div>
    <div id="go-map"></div>
  </div>` : ''}

  <!-- STILL ON LIST -->
  ${activeCards.length > 0 ? `
  <div class="section-head"><h2>⏳ Still on the list</h2><div class="section-rule"></div><div class="section-count">${activeCards.length} items</div></div>
  <div class="still-wrap">
    ${activeCards.map(c=>{
      const cat=getCat(c.idList);
      return `<div class="still-chip"><div class="still-dot" style="background:${cat.solid}"></div>${cat.emoji} ${c.name}</div>`;
    }).join('')}
  </div>` : ''}

  <!-- CALENDAR -->
  <div class="section-head"><h2>📅 When things got done</h2><div class="section-rule"></div></div>
  ${renderCalendar(calMap, doneCards)}
  `;
}

function renderCalendar(calMap, doneCards){
  if(!doneCards.length) return `<p style="font-size:.85rem;color:var(--muted);padding:.5rem 0">Mark items done in Trello with a Completed date to see them here.</p>`;
  const dates=Object.keys(calMap).sort();
  if(!dates.length) return `<p style="font-size:.85rem;color:var(--muted);padding:.5rem 0">Set a date in the Completed field to populate the calendar.</p>`;

  // Date range: start on Sunday of earliest week, end on Saturday of latest week
  const earliest = new Date(dates[0]);
  const latest   = new Date(dates[dates.length-1]);

  // Extend range to show at least a few months context
  const rangeStart = new Date(earliest.getFullYear(), earliest.getMonth(), 1);
  const rangeEnd   = new Date(latest.getFullYear(),   latest.getMonth()+1, 0);

  // Align to week boundaries (Sun=0)
  const gridStart = new Date(rangeStart);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay()); // back to Sunday
  const gridEnd = new Date(rangeEnd);
  gridEnd.setDate(gridEnd.getDate() + (6 - gridEnd.getDay())); // forward to Saturday

  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DOW=['','M','','W','','F',''];
  const col=n=>n===0?null:n===1?'#a8d5bc':n===2?'#4fa97a':'#1e6e47';
  const CELL=22, GAP=3, STEP=CELL+GAP;

  // Build array of weeks (each week = array of 7 days Sun→Sat)
  const weeks=[];
  let d=new Date(gridStart);
  while(d<=gridEnd){
    const week=[];
    for(let i=0;i<7;i++){
      week.push(new Date(d));
      d.setDate(d.getDate()+1);
    }
    weeks.push(week);
  }

  // Month label positions: find first week where month changes
  const monthLabels=[];
  let lastMonth=-1;
  weeks.forEach((week,wi)=>{
    // Use Thursday of week to assign month (GitHub convention)
    const thu=week[4];
    if(thu.getMonth()!==lastMonth){
      lastMonth=thu.getMonth();
      const label=MN[thu.getMonth()]+(thu.getMonth()===0?` '${String(thu.getFullYear()).slice(2)}`:'');
      monthLabels.push({wi,label});
    }
  });

  // Build week columns HTML
  const weekCols = weeks.map(week=>{
    const cells = week.map((day,di)=>{
      const inRange = day>=rangeStart && day<=rangeEnd;
      if(!inRange) return `<div class="cal-cell blank" style="width:${CELL}px;height:${CELL}px"></div>`;
      const k=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
      const its=calMap[k]||[], c=col(its.length);
      const tip=its.map(i=>i.name).join(', ');
      if(c) return `<div class="cal-cell has-items" style="width:${CELL}px;height:${CELL}px;background:${c}" data-tip="${tip.replace(/"/g,'&quot;')}" title="${tip}"></div>`;
      return `<div class="cal-cell no-items" style="width:${CELL}px;height:${CELL}px"></div>`;
    }).join('');
    return `<div class="cal-week-col" style="gap:${GAP}px">${cells}</div>`;
  }).join('');

  // Month label bar — positioned absolutely over the grid
  const labelBar = monthLabels.map(({wi,label})=>
    `<span class="cal-month-tick" style="left:${wi*STEP}px">${label}</span>`
  ).join('');

  // DOW labels (just M W F to keep it clean)
  const dowLabels = DOW.map(l=>`<div class="cal-dow-label" style="width:20px;height:${CELL}px;margin-bottom:${GAP}px;font-size:.72rem">${l}</div>`).join('');

  const gridWidth = weeks.length * STEP;

  return `<div>
    <div class="cal-grid-wrap">
      <div style="display:flex;align-items:flex-start">
        <div style="display:flex;flex-direction:column;margin-right:4px;padding-top:18px">
          ${dowLabels}
        </div>
        <div style="flex:1">
          <div class="cal-month-labels" style="width:${gridWidth}px;position:relative;height:18px;margin-bottom:4px">
            ${labelBar}
          </div>
          <div class="cal-body" style="gap:${GAP}px">
            ${weekCols}
          </div>
        </div>
      </div>
    </div>
    <div class="cal-legend">
      <div class="cal-legend-swatch" style="background:var(--border)"></div><span>none</span>
      <div class="cal-legend-swatch" style="background:#a8d5bc"></div><span>1</span>
      <div class="cal-legend-swatch" style="background:#4fa97a"></div><span>2</span>
      <div class="cal-legend-swatch" style="background:#1e6e47"></div><span>3+</span>
    </div>
  </div>`;
}


function renderModal(){
  if(!selected) return '';
  const c=selected, cat=getCat(c.idList);
  const typeLabel=c.labels&&c.labels.length?c.labels[0].name:'';
  const hasDesc=c.desc&&!c.desc.startsWith('http')&&!c.desc.startsWith('[http');
  const linkMatch=c.desc&&c.desc.match(/https?:\/\/[^\s\)"]+/);
  const completedD=getCompletedDate(c);
  const dateStr=completedD?completedD.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';
  return `<div class="overlay" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-band" style="background:${cat.solid}"></div>
      <div class="modal-inner">
        <div class="modal-cat" style="color:${cat.text}">${cat.emoji} ${cat.label}</div>
        <div class="modal-title">${c.name}</div>
        <div class="modal-meta">
          ${typeLabel?`<span class="modal-badge" style="background:${cat.bg};color:${cat.text}">${typeLabel}</span>`:''}
          ${dateStr?`<span class="modal-badge" style="background:var(--bg);color:var(--muted)">✅ ${dateStr}</span>`:''}
        </div>
        ${hasDesc?`<div class="modal-note">${c.desc}</div>`:''}
        <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem">
          ${linkMatch?`<a class="modal-link" href="${linkMatch[0]}" target="_blank" rel="noopener">↗ Open link</a>`:''}
          <a class="modal-link" href="${c.url}" target="_blank" rel="noopener">↗ View in Trello</a>
        </div>
        <div class="modal-footer">
          <span style="font-size:.76rem;color:var(--muted)">Click outside to close</span>
          <button class="btn-close" onclick="closeModal(null)">Close</button>
        </div>
      </div>
    </div>
  </div>`;
}

function render(){
  const app=document.getElementById('app');
  if(loading){app.innerHTML=`<div class="loading"><div class="spinner"></div><br>Loading JC-TC...</div>`;return;}
  if(error){app.innerHTML=`<div style="max-width:920px;margin:0 auto;padding:2rem"><div class="error-box">${error}<br><br><button onclick="fetchBoard()" style="margin-top:.5rem;padding:.4rem .9rem;border:1px solid #9e2828;border-radius:6px;background:transparent;cursor:pointer;color:#9e2828;font-family:inherit">Try again</button></div></div>`;return;}
  app.innerHTML = renderReport() + (selected?renderModal():'');
  setTimeout(()=>initMap(), 150);
}

window.openCard  = id => { selected=allCards.find(c=>c.id===id); render(); };
window.closeModal= e  => { if(!e||e.target.classList.contains('overlay')){selected=null;render();} };

fetchBoard();
</script>

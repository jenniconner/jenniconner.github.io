<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scooby Dooby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="burst" aria-hidden="true"></div>

  <main>
    <h1>Scooby&nbsp;Dooby</h1>
    <p class="hint">Press the buttons, or hit <kbd>S</kbd> and <kbd>D</kbd></p>

    <div class="buttons">
      <button id="btn-scooby" class="btn scooby" type="button">Scooby <span class="key">S</span></button>
      <button id="btn-dooby" class="btn dooby" type="button">Dooby <span class="key">D</span></button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
